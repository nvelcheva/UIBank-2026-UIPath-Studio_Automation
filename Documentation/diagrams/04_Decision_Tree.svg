<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900">
  <defs>
    <linearGradient id="decisionYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <linearGradient id="actionBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="yesGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="noRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#DC2626"/>
    </linearGradient>
  </defs>
  
  <rect width="1100" height="900" fill="#F8FAFC"/>
  
  <text x="550" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E293B" text-anchor="middle">DECISION TREE DIAGRAM</text>
  
  <!-- Start -->
  <rect x="450" y="70" width="200" height="50" rx="25" fill="url(#actionBlue)"/>
  <text x="550" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">READ PDF FILE</text>
  
  <!-- Arrow -->
  <line x1="550" y1="120" x2="550" y2="160" stroke="#64748B" stroke-width="2"/>
  <polygon points="550,170 545,160 555,160" fill="#64748B"/>
  
  <!-- Decision 1: Currency -->
  <polygon points="550,170 680,240 550,310 420,240" fill="url(#decisionYellow)"/>
  <text x="550" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Currency</text>
  <text x="550" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">= USD?</text>
  
  <!-- Yes branch -->
  <line x1="680" y1="240" x2="780" y2="240" stroke="#10B981" stroke-width="2"/>
  <text x="720" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10B981">YES</text>
  <rect x="780" y="210" width="150" height="60" rx="8" fill="url(#yesGreen)"/>
  <text x="855" y="235" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">ExchangeRate</text>
  <text x="855" y="255" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">= 1.0</text>
  
  <!-- No branch -->
  <line x1="420" y1="240" x2="320" y2="240" stroke="#EF4444" stroke-width="2"/>
  <text x="380" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#EF4444">NO</text>
  <rect x="170" y="210" width="150" height="60" rx="8" fill="url(#noRed)"/>
  <text x="245" y="235" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Get Rate from</text>
  <text x="245" y="255" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Switch/Case</text>
  
  <!-- Merge -->
  <line x1="245" y1="270" x2="245" y2="340" stroke="#64748B" stroke-width="2"/>
  <line x1="855" y1="270" x2="855" y2="340" stroke="#64748B" stroke-width="2"/>
  <line x1="245" y1="340" x2="855" y2="340" stroke="#64748B" stroke-width="2"/>
  <line x1="550" y1="340" x2="550" y2="370" stroke="#64748B" stroke-width="2"/>
  <polygon points="550,380 545,370 555,370" fill="#64748B"/>
  
  <!-- Convert -->
  <rect x="450" y="380" width="200" height="50" rx="8" fill="url(#actionBlue)"/>
  <text x="550" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Convert to USD</text>
  
  <!-- Arrow -->
  <line x1="550" y1="430" x2="550" y2="470" stroke="#64748B" stroke-width="2"/>
  <polygon points="550,480 545,470 555,470" fill="#64748B"/>
  
  <!-- Decision 2: Approved -->
  <polygon points="550,480 680,550 550,620 420,550" fill="url(#decisionYellow)"/>
  <text x="550" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PDF Decision</text>
  <text x="550" y="560" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">= APPROVED?</text>
  
  <!-- Yes branch - Submit -->
  <line x1="680" y1="550" x2="780" y2="550" stroke="#10B981" stroke-width="2"/>
  <text x="720" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10B981">YES</text>
  <rect x="780" y="520" width="150" height="60" rx="8" fill="url(#yesGreen)"/>
  <text x="855" y="545" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Submit to</text>
  <text x="855" y="565" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">UiBank</text>
  
  <!-- No branch - Skip -->
  <line x1="420" y1="550" x2="320" y2="550" stroke="#EF4444" stroke-width="2"/>
  <text x="380" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#EF4444">NO</text>
  <rect x="170" y="520" width="150" height="60" rx="8" fill="url(#noRed)"/>
  <text x="245" y="545" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Status =</text>
  <text x="245" y="565" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">SKIPPED</text>
  
  <!-- Sub-decision for New Application -->
  <line x1="855" y1="580" x2="855" y2="640" stroke="#64748B" stroke-width="2"/>
  <polygon points="855,650 850,640 860,640" fill="#64748B"/>
  
  <polygon points="855,650 955,710 855,770 755,710" fill="url(#decisionYellow)"/>
  <text x="855" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">ID contains</text>
  <text x="855" y="720" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">"NEW"?</text>
  
  <!-- Yes - Create Account -->
  <line x1="955" y1="710" x2="1020" y2="710" stroke="#10B981" stroke-width="2"/>
  <text x="980" y="700" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#10B981">YES</text>
  <rect x="1020" y="680" width="60" height="60" rx="8" fill="url(#yesGreen)"/>
  <text x="1050" y="705" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Create</text>
  <text x="1050" y="720" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Account</text>
  
  <!-- No - Use Existing -->
  <line x1="755" y1="710" x2="700" y2="710" stroke="#EF4444" stroke-width="2"/>
  <text x="735" y="700" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#EF4444">NO</text>
  <rect x="620" y="680" width="80" height="60" rx="8" fill="url(#noRed)"/>
  <text x="660" y="705" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Use</text>
  <text x="660" y="720" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Existing ID</text>
  
  <!-- Final merge -->
  <line x1="245" y1="580" x2="245" y2="820" stroke="#64748B" stroke-width="2"/>
  <line x1="660" y1="740" x2="660" y2="820" stroke="#64748B" stroke-width="2"/>
  <line x1="1050" y1="740" x2="1050" y2="780" stroke="#64748B" stroke-width="2"/>
  <line x1="1050" y1="780" x2="855" y2="780" stroke="#64748B" stroke-width="2"/>
  <line x1="855" y1="780" x2="855" y2="820" stroke="#64748B" stroke-width="2"/>
  <line x1="245" y1="820" x2="855" y2="820" stroke="#64748B" stroke-width="2"/>
  <line x1="550" y1="820" x2="550" y2="850" stroke="#64748B" stroke-width="2"/>
  <polygon points="550,860 545,850 555,850" fill="#64748B"/>
  
  <!-- Add to Results -->
  <rect x="450" y="860" width="200" height="30" rx="15" fill="url(#actionBlue)"/>
  <text x="550" y="880" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ADD TO RESULTS</text>
  
  <!-- Legend -->
  <rect x="50" y="70" width="120" height="150" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="110" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">LEGEND</text>
  <polygon points="110,120 130,135 110,150 90,135" fill="url(#decisionYellow)"/>
  <text x="110" y="170" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Decision</text>
  <rect x="80" y="185" width="60" height="20" rx="4" fill="url(#actionBlue)"/>
  <text x="110" y="215" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Action</text>
</svg>
