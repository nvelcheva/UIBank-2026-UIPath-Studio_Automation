<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="paBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#0052CC"/>
    </linearGradient>
    <linearGradient id="sharepoint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#038387"/>
      <stop offset="100%" style="stop-color:#026D70"/>
    </linearGradient>
    <linearGradient id="uipathOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FA4616"/>
      <stop offset="100%" style="stop-color:#E03E12"/>
    </linearGradient>
    <linearGradient id="excel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#217346"/>
      <stop offset="100%" style="stop-color:#185C37"/>
    </linearGradient>
    <linearGradient id="teams" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6264A7"/>
      <stop offset="100%" style="stop-color:#5254A3"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="#F8FAFC"/>
  
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E293B" text-anchor="middle">POWER AUTOMATE + UIPATH INTEGRATION FLOW</text>
  
  <!-- Power Automate Header -->
  <rect x="50" y="70" width="500" height="40" rx="5" fill="url(#paBlue)"/>
  <text x="300" y="97" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">☁️ POWER AUTOMATE (CLOUD)</text>
  
  <!-- UiPath Header -->
  <rect x="650" y="70" width="500" height="40" rx="5" fill="url(#uipathOrange)"/>
  <text x="900" y="97" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">🤖 UIPATH (DESKTOP)</text>
  
  <!-- Step 1: Trigger -->
  <rect x="100" y="140" width="180" height="70" rx="10" fill="url(#paBlue)"/>
  <text x="190" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">⏰ RECURRENCE</text>
  <text x="190" y="190" font-family="Arial, sans-serif" font-size="10" fill="#DBEAFE" text-anchor="middle">Daily at 9:00 AM</text>
  
  <!-- Arrow -->
  <line x1="190" y1="210" x2="190" y2="250" stroke="#64748B" stroke-width="2"/>
  <polygon points="190,260 185,250 195,250" fill="#64748B"/>
  
  <!-- Step 2: Get Files -->
  <rect x="100" y="260" width="180" height="70" rx="10" fill="url(#sharepoint)"/>
  <text x="190" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">📁 GET FILES</text>
  <text x="190" y="310" font-family="Arial, sans-serif" font-size="10" fill="#CCFBF1" text-anchor="middle">SharePoint Library</text>
  
  <!-- Arrow -->
  <line x1="190" y1="330" x2="190" y2="370" stroke="#64748B" stroke-width="2"/>
  <polygon points="190,380 185,370 195,370" fill="#64748B"/>
  
  <!-- Step 3: For Each -->
  <rect x="60" y="380" width="260" height="200" rx="10" fill="#E0E7FF" stroke="#6366F1" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="190" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338CA" text-anchor="middle">🔄 FOR EACH PDF</text>
  
  <!-- Sub-step: Get Content -->
  <rect x="80" y="420" width="140" height="40" rx="6" fill="url(#sharepoint)"/>
  <text x="150" y="445" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">📄 Get Content</text>
  
  <!-- Sub-step: AI Builder -->
  <rect x="80" y="470" width="140" height="40" rx="6" fill="#8B5CF6"/>
  <text x="150" y="495" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">🧠 AI Builder OCR</text>
  
  <!-- Sub-step: HTTP -->
  <rect x="80" y="520" width="140" height="40" rx="6" fill="#06B6D4"/>
  <text x="150" y="545" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">🌐 HTTP Rate API</text>
  
  <!-- Connector to UiPath -->
  <line x1="280" y1="490" x2="420" y2="490" stroke="#FA4616" stroke-width="3"/>
  <polygon points="430,490 420,485 420,495" fill="#FA4616"/>
  <text x="350" y="480" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FA4616">Trigger Job</text>
  
  <!-- UiPath Job Box -->
  <rect x="440" y="380" width="280" height="200" rx="10" fill="#FFF7ED" stroke="#FA4616" stroke-width="2"/>
  <text x="580" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C2410C" text-anchor="middle">🤖 UIPATH JOB</text>
  
  <!-- UiPath Steps -->
  <rect x="460" y="420" width="120" height="35" rx="5" fill="url(#uipathOrange)"/>
  <text x="520" y="442" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">📄 Read PDF</text>
  
  <rect x="460" y="460" width="120" height="35" rx="5" fill="url(#uipathOrange)"/>
  <text x="520" y="482" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">🔍 Extract Data</text>
  
  <rect x="460" y="500" width="120" height="35" rx="5" fill="url(#uipathOrange)"/>
  <text x="520" y="522" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">💱 Convert</text>
  
  <rect x="460" y="540" width="120" height="35" rx="5" fill="url(#uipathOrange)"/>
  <text x="520" y="562" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">🌐 Submit UiBank</text>
  
  <!-- UiPath Arrows -->
  <line x1="580" y1="437" x2="620" y2="437" stroke="#C2410C" stroke-width="1"/>
  <line x1="620" y1="437" x2="620" y2="477" stroke="#C2410C" stroke-width="1"/>
  <line x1="620" y1="477" x2="580" y2="477" stroke="#C2410C" stroke-width="1"/>
  <line x1="580" y1="517" x2="620" y2="517" stroke="#C2410C" stroke-width="1"/>
  <line x1="620" y1="517" x2="620" y2="557" stroke="#C2410C" stroke-width="1"/>
  <line x1="620" y1="557" x2="580" y2="557" stroke="#C2410C" stroke-width="1"/>
  
  <!-- Return result -->
  <line x1="580" y1="557" x2="650" y2="557" stroke="#C2410C" stroke-width="2"/>
  <line x1="650" y1="557" x2="650" y2="620" stroke="#C2410C" stroke-width="2"/>
  <line x1="650" y1="620" x2="350" y2="620" stroke="#64748B" stroke-width="2"/>
  <polygon points="340,620 350,615 350,625" fill="#64748B"/>
  <text x="500" y="610" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Return Result</text>
  
  <!-- Back to PA: Collect Results -->
  <rect x="100" y="600" width="180" height="50" rx="10" fill="url(#paBlue)"/>
  <text x="190" y="630" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">📊 Collect Results</text>
  
  <!-- Arrow -->
  <line x1="190" y1="650" x2="190" y2="680" stroke="#64748B" stroke-width="2"/>
  <polygon points="190,690 185,680 195,680" fill="#64748B"/>
  
  <!-- Excel Online -->
  <rect x="100" y="690" width="180" height="50" rx="10" fill="url(#excel)"/>
  <text x="190" y="720" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">📗 Excel Online</text>
  
  <!-- Arrow to Teams -->
  <line x1="280" y1="715" x2="340" y2="715" stroke="#64748B" stroke-width="2"/>
  <polygon points="350,715 340,710 340,720" fill="#64748B"/>
  
  <!-- Teams Notification -->
  <rect x="350" y="690" width="180" height="50" rx="10" fill="url(#teams)"/>
  <text x="440" y="720" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">💬 Teams Notify</text>
  
  <!-- Benefits comparison -->
  <rect x="750" y="400" width="400" height="350" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="950" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">WHY HYBRID APPROACH?</text>
  
  <!-- Power Automate benefits -->
  <text x="770" y="470" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0066FF">☁️ Power Automate:</text>
  <text x="780" y="495" font-family="Arial, sans-serif" font-size="11" fill="#475569">✓ Cloud scheduling</text>
  <text x="780" y="515" font-family="Arial, sans-serif" font-size="11" fill="#475569">✓ SharePoint native</text>
  <text x="780" y="535" font-family="Arial, sans-serif" font-size="11" fill="#475569">✓ Teams notifications</text>
  <text x="780" y="555" font-family="Arial, sans-serif" font-size="11" fill="#475569">✓ No infrastructure</text>
  
  <!-- UiPath benefits -->
  <text x="770" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FA4616">🤖 UiPath:</text>
  <text x="780" y="620" font-family="Arial, sans-serif" font-size="11" fill="#475569">✓ Web automation</text>
  <text x="780" y="640" font-family="Arial, sans-serif" font-size="11" fill="#475569">✓ PDF processing</text>
  <text x="780" y="660" font-family="Arial, sans-serif" font-size="11" fill="#475569">✓ Complex logic</text>
  <text x="780" y="680" font-family="Arial, sans-serif" font-size="11" fill="#475569">✓ Error handling</text>
  
  <!-- Combined -->
  <text x="770" y="720" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10B981">✨ Combined = Best of Both!</text>
</svg>
