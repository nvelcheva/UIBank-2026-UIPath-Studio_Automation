<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1E293B" text-anchor="middle">LOAN AUTOMATION SYSTEM - HIGH-LEVEL ARCHITECTURE</text>
  
  <!-- PDF Input Box -->
  <rect x="50" y="150" width="200" height="120" rx="15" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">📄 PDF INPUT</text>
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">100 Loan Applications</text>
  <text x="150" y="240" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">(.pdf files)</text>
  
  <!-- Arrow 1 -->
  <path d="M 260 210 L 320 210" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <polygon points="320,210 310,205 310,215" fill="#64748B"/>
  
  <!-- UiPath Robot Box -->
  <rect x="330" y="120" width="250" height="180" rx="15" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="455" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">🤖 UIPATH ROBOT</text>
  <text x="455" y="190" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">• Read PDF Text</text>
  <text x="455" y="210" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">• Extract Data (Regex)</text>
  <text x="455" y="230" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">• Convert Currency</text>
  <text x="455" y="250" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">• Process Decisions</text>
  <text x="455" y="270" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">• Generate Report</text>
  
  <!-- Arrow 2 -->
  <path d="M 590 210 L 650 210" stroke="#64748B" stroke-width="3" fill="none"/>
  <polygon points="650,210 640,205 640,215" fill="#64748B"/>
  
  <!-- UiBank Website Box -->
  <rect x="660" y="150" width="200" height="120" rx="15" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="760" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">🌐 UIBANK WEB</text>
  <text x="760" y="220" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">• Account Creation</text>
  <text x="760" y="240" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">• Loan Submission</text>
  
  <!-- Arrow 3 -->
  <path d="M 870 210 L 930 210" stroke="#64748B" stroke-width="3" fill="none"/>
  <polygon points="930,210 920,205 920,215" fill="#64748B"/>
  
  <!-- Excel Output Box -->
  <rect x="940" y="150" width="200" height="120" rx="15" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="1040" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">📊 EXCEL OUTPUT</text>
  <text x="1040" y="220" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">LoanResults.xlsx</text>
  <text x="1040" y="240" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">14 columns × 100 rows</text>
  
  <!-- Data Storage Box -->
  <rect x="200" y="400" width="800" height="100" rx="15" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569" text-anchor="middle">💾 DATA STORAGE</text>
  <text x="350" y="470" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Local File System (PDFs)</text>
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">In-Memory DataTable</text>
  <text x="850" y="470" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Excel Workbook</text>
  
  <!-- Connecting lines to storage -->
  <path d="M 150 280 L 150 340 L 350 340 L 350 395" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M 455 310 L 455 340 L 600 340 L 600 395" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M 1040 280 L 1040 340 L 850 340 L 850 395" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <!-- API Box -->
  <rect x="330" y="550" width="180" height="80" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="420" y="585" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">💱 EXCHANGE RATE</text>
  <text x="420" y="610" font-family="Arial, sans-serif" font-size="11" fill="#A16207" text-anchor="middle">Currency Conversion API</text>
  
  <!-- Arrow to API -->
  <path d="M 455 310 L 455 330 L 420 330 L 420 545" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <!-- Chrome Box -->
  <rect x="690" y="550" width="180" height="80" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="780" y="585" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">🌐 CHROME BROWSER</text>
  <text x="780" y="610" font-family="Arial, sans-serif" font-size="11" fill="#1D4ED8" text-anchor="middle">Web Automation</text>
  
  <!-- Arrow to Chrome -->
  <path d="M 760 280 L 760 330 L 780 330 L 780 545" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <!-- Legend -->
  <rect x="50" y="700" width="1100" height="80" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="100" y="730" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">LEGEND:</text>
  <rect x="180" y="715" width="20" height="20" rx="3" fill="url(#blueGrad)"/>
  <text x="210" y="730" font-family="Arial, sans-serif" font-size="12" fill="#475569">Input/Output</text>
  <rect x="320" y="715" width="20" height="20" rx="3" fill="url(#greenGrad)"/>
  <text x="350" y="730" font-family="Arial, sans-serif" font-size="12" fill="#475569">Processing</text>
  <rect x="460" y="715" width="20" height="20" rx="3" fill="url(#orangeGrad)"/>
  <text x="490" y="730" font-family="Arial, sans-serif" font-size="12" fill="#475569">External System</text>
  <line x1="620" y1="725" x2="680" y2="725" stroke="#64748B" stroke-width="3"/>
  <text x="690" y="730" font-family="Arial, sans-serif" font-size="12" fill="#475569">Data Flow</text>
  <line x1="800" y1="725" x2="860" y2="725" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="870" y="730" font-family="Arial, sans-serif" font-size="12" fill="#475569">Connection</text>
</svg>
